#enviroment variables
env = QT_QPA_PLATFORM,wayland;xcb
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORMTHEME,gtk3

# hyprCursor settings
env = HYPRCURSOR_THEME,Bibata-Modern-Amber
env = HYPRCURSOR_SIZE,18
env = XCURSOR_THEME,Bibata-Modern-Amber
env = XCURSOR_SIZE,18

# xCursor settings
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Amber'
exec-once = gsettings set org.gnome.desktop.interface cursor-size '18'

# maneaters
monitor=eDP-1,preffered,auto,1.0
monitor=HDMI-A-1,1920x1080,0x0,0.8
monitor=DP-5,preffered,auto,1

# Autostart
exec-once = systemctl --user start hyprpolkitagent
exec-once = setbg
exec-once = exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY
exec-once = killall xdg-desktop-portal && setsid -f /usr/lib/xdg-desktop-portal && setsid -f /usr/lib/xdg-desktop-portal-hyprland
exec-once = ssh-agent
exec-once = dunst
# exec-once = hyprctl setcursor macOS 16
exec-once = waybar
exec-once = checkup
exec-once = foot -s
exec-once = copyq
exec-once = nm-applet
exec-once = hyprdim

# exec-once = doas kmonad ~/.config/kmonad/tkl.kbd

$gnome-schema = org.gnome.desktop.interface

source=~/.config/hypr/theme.conf

input {
  kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape_shifted_capslock
    kb_rules =

    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1
    touchpad {
      disable_while_typing = true
      natural_scroll = true
      scroll_factor = .25
    }

  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

devices {
  elan-trackpoint {
  }
}

gestures {
  workspace_swipe = on
    workspace_swipe_fingers = 3
    workspace_swipe_create_new = true
}

general {
    gaps_in = 3
    gaps_out = 5
    border_size = 3
    resize_on_border = true
    col.active_border = $flamingo $teal $pink $mauve
    col.inactive_border = $surface0
    layout = dwindle
}

group {
    col.border_active = $rosewater
    col.border_inactive = $base
    groupbar {
      enabled = false
      gradients = true
      # col.inactive = $base
      # col.active = $rosewater $flamingo $pink $mauve $maroon $peach $teal $sky $sapphire $lavender
      render_titles = false
      height = 1
      scrolling = false
    }
}

cursor {
  inactive_timeout = 2
  persistent_warps = true
}

decoration {
  rounding = 5
    blur {
    enabled = true
    size = 4
    passes = 2
    new_optimizations = true
    xray = false
    }

    # drop_shadow = false
    # shadow_ignore_window = true
    # shadow_offset = 0 0
    # shadow_range = 15
    # shadow_render_power = 5
    # col.shadow = 0x66000000
}

animations {

    bezier = decel, 0.05, 0.7, 0.1, 1
    bezier = overshot,0.7,0.6,0.1,1.1
    bezier = easeOutback,0.34,1.56,0.64,1

    enabled=1
    animation = windows, 1, 2, overshot, slide
    animation = windowsOut, 1, 2, default, popin 10%
    animation = windowsMove, 1, 2, default
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces,1,5,easeOutback,slide
    animation = specialWorkspace,1,4,easeOutback,slidevert
}

dwindle {
    pseudotile = yes
    force_split = 2
    preserve_split = true # you probably want this
    special_scale_factor = .98
}

misc {
  vfr = true
  font_family = "Jetbrains Mono Nerd Font"
  enable_swallow = true
  swallow_regex = footclient
  disable_hyprland_logo = true
  disable_splash_rendering = true
  focus_on_activate = true
  new_window_takes_over_fullscreen = 2
  mouse_move_enables_dpms = true
}

debug {
  disable_logs = false
}

# Windowrules
windowrule = float, fuzzylaunch
windowrule = float, copyq
windowrule = pin, copyq
windowrule = size 40% 50%, copyq
windowrulev2 = float,class:brave-browser, title:.*Rabby.*
windowrulev2 = float,class:brave-browser, title:.*MetaMask.*
windowrule = pin, dragon-drop
windowrule = workspace 9, Gimp
# windowrulev2 = fullscreenstate -1 3, class:brave-browser, title:.*Discord \|.*
windowrule = workspace 3, org.telegram.desktop
windowrule = workspace 5, epyterm
windowrule = workspace special,animation:decel

# Layerrules
layerrule = blur, notifications

# Workspace Rules
workspace = special:one, on-created-empty
# workspace = 1, on-created-empty:discord
# workspace = 2, gapsin:1, gapsout:0, border:false, rounding:false, decorate:false, shadow:false #, on-created-empty:brave
# workspace = 3, on-created-empty:telegram-desktop
workspace = special:two, on-created-empty:footclient -e nvim -c VimwikiDiaryIndex

# Binds
$mod1 = SUPER
$mod2 = SUPERSHIFT
$mod3 = SUPERALT
$mod4 = Alt_L
$term = footclient

# Actions
bind = $mod1, P, pseudo, active
bind = $mod1, Escape, exec, hyprlock
bind = $mod1, Return, exec, $term
bind = $mod1, Q, killactive, 
bind = $mod1 CONTROL SHIFT, M, exit, 
bind = $mod1, S, pin, 
bind = ,Print, exec, grimblast --notify copy area
bind = $mod1, Print, exec, grimblast --notify save area - | swappy -f -
bind = $mod1 SHIFT, X, exec, grim -g "$(slurp)" - | swappy -f - -o /home/siki/pix/ss
bind = $mod1 SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod1 SHIFT, G, exec, grim

# Special wrkspcs
bind = $mod2, Return, togglespecialworkspace, one
bind = $mod4 Shift, Return, togglespecialworkspace, two
bind = $mod1, M, movetoworkspace, special:one
bind = $mod4, M, movetoworkspace, special:two
bindl = ,switch:Lid Switch, exec, hyprlock
bind = ,XF86PowerOff, exec, wact

# scripts
     bind = $mod4, Space, exec, tofi-run | sh
     bind = $mod1, Space, exec, tofi-drun | sh
     bind = ,XF86PickupPhone, exec, bluu
     bind = ,XF86HangupPhone, exec, bluetoothctl power off
     # bindr = $mod1, SUPER_L, exec, pkill tofi || tofi-drun | sh
     bind = Control, grave, exec, demoji
     bind = $mod1 SHIFT, b, exec, wayread
     bind = $mod1, Backspace, exec, wact
     bind = $mod1, P, exec, passmenu
     bind = $mod1, X, exec, battery
     bind = $mod1, C, exec, copyq toggle

# Apps
     bind = $mod1, W, exec, [workspace 2] zen-browser
     bind = ,XF86NotificationCenter, exec, telegram-desktop
     bind = ,XF86Favorites, exec, dnd_toggle
     bind = CONTROL, Escape, exec, $term -e btop
#
# Function keys
     bind = $mod1, F1, exec, timer &
     bind = ,XF86Display, dpms, off
     # bind = ,XF86Display, exec, killall wf-recorder || wf-recorder --muxer=v4l2 --codec=rawvideo --file=/dev/video9 -x yuv420p
     bind = $mod1, F4, exec, $term -e pulsemixer
     bind = $mod1, F6, exec, torwrap
     bind = $mod1, F7, exec, td-toggle
     bind = $mod1, F11, exec, [float;pin] mpv av://v4l2:/dev/video0 --profile=low-latency --untimed --vf=hflip,rotate=0 --title=webcam
     bind = $mod1, F12, exec, checkup

# Move focus with mod + arrow keys
     bind = $mod1, G, togglegroup
     bind = $mod4, G, movewindoworgroup, r
     bind = $mod1, period, changegroupactive, f
     bind = $mod1, comma, changegroupactive, b
     # bind = $mod1 SHIFT, D, togglesplit, # dwindle
     bind = $mod1, K, cyclenext,
     bind = $mod1, J, cyclenext, prev
     binde = $mod1 SHIFT, L, resizeactive, 40 0
     binde = $mod1 SHIFT, H, resizeactive, -40 0
     binde = $mod1 SHIFT, k, resizeactive, 0 -40
     binde = $mod1 SHIFT, j, resizeactive, 0 40
     bind = $mod1, Space, layoutmsg, swapwithmaster 
     bind = $mod1 SHIFT, Space, togglefloating, 
     bind = $mod1, F, fullscreen, 0
     bind = $mod2, F, fullscreenstate, -1 3
     bind = ,F2, exec, pidof waybar && killall waybar || setsid -f waybar

# Media
     bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%+ 
     bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%-
     bindel = SHIFT ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 3%+ 
     bindel = SHIFT ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 3%-
     bindl = ,XF86AudioMute,exec,wpctl set-mute @DEFAULT_SINK@ toggle
     bindl = ,XF86AudioMicMute,exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
     bindl = $mod1, XF86AudioMute, exec, playerctl play-pause
     bindl = $mod1, XF86AudioRaiseVolume, exec, playerctl next
     bindl = $mod1, XF86AudioLowerVolume, exec, playerctl previous

     # binde = Alt_L, Super_L, exec, wpctl set-volume @DEFAULT_SOURCE@ 3%+ 
     # binde = Control_L, Alt_L, exec, wpctl set-volume @DEFAULT_SOURCE@ 3%-

     bindel= ,XF86MonBrightnessDown, exec, xbacklight -dec 2 # && notify-send -i "lol" "☀️  $(xbacklight -get)" -t 1000 -r 1
     bindel= ,XF86MonBrightnessUp, exec, xbacklight -inc 5 # && notify-send -i "lol" "☀️  $(xbacklight -get)" -t 1000 -r 1

     # binde= ALT ,9, exec, light -U 2 && notify-send -i "lol" "☀️  $(light -G | cut -d'.' -f1)" -t 1000 -r 1
     # binde= ALT ,0, exec, light -A 2 && notify-send -i "lol" "☀️  $(light -G | cut -d'.' -f1)" -t 1000 -r 1

# Switch workspaces with mod + [0-9]
     bind = $mod1, 1, workspace, 1
     bind = $mod1, 2, workspace, 2
     bind = $mod1, 3, workspace, 3
     bind = $mod1, 4, workspace, 4
     bind = $mod1, 5, workspace, 5
     bind = $mod1, 6, workspace, 6
     bind = $mod1, 7, workspace, 7
     bind = $mod1, 8, workspace, 8
     bind = $mod1, 9, workspace, 9
     bind = $mod1, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
     bind = $mod1 SHIFT, 1, movetoworkspacesilent, 1
     bind = $mod1 SHIFT, 2, movetoworkspacesilent, 2
     bind = $mod1 SHIFT, 3, movetoworkspacesilent, 3
     bind = $mod1 SHIFT, 4, movetoworkspacesilent, 4
     bind = $mod1 SHIFT, 5, movetoworkspacesilent, 5
     bind = $mod1 SHIFT, 6, movetoworkspacesilent, 6
     bind = $mod1 SHIFT, 7, movetoworkspacesilent, 7
     bind = $mod1 SHIFT, 8, movetoworkspacesilent, 8
     bind = $mod1 SHIFT, 9, movetoworkspacesilent, 9
     bind = $mod1 SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mod + scroll
     bind = $mod1, mouse_down, workspace, e+1
     bind = $mod1, mouse_up, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
     bindm = $mod1, mouse:272, movewindow
     bindm = $mod1, mouse:273, resizewindow
