#enviroment variables
env = QT_QPA_PLATFORM,wayland;xcb
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,18
env = QT_QPA_PLATFORMTHEME,gtk3

# maneaters
monitor=eDP-1,preffered,auto,1
# monitor=HDMI-A-1,1920x1080,0x0,0.8
monitor=DP-2,preffered,auto,1

# Autostart
exec-once = setbg
exec-once=exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY
exec-once=killall xdg-desktop-portal && /usr/lib/xdg-desktop-portal && /usr/lib/xdg-desktop-portal-hyprland &
exec-once = ssh-agent
exec-once = pipewire-pulse
exec-once = dunst
# exec-once = hyprctl setcursor capitaine-cursors 16
# exec-once = hypridle
exec-once = waybar
exec-once = checkup
exec-once = foot -s
exec-once = hyprdim
# exec-once = doas kmonad ~/.config/kmonad/tkl.kbd

$gnome-schema = org.gnome.desktop.interface
# exec-once = gsettings set $gnome-schema cursor-theme 'capitaine-cursors'

 source=~/.config/hypr/theme.conf

input {
  kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape_shifted_capslock
    kb_rules =

    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1
    touchpad {
      disable_while_typing = true
      natural_scroll = true
      scroll_factor = .25
    }

  sensitivity = -0.1 # -1.0 - 1.0, 0 means no modification.
}

gestures {
  workspace_swipe = on
    workspace_swipe_fingers = 3
    workspace_swipe_create_new = true
}

general {
    gaps_in = 3
    gaps_out = 5
    border_size = 3
    resize_on_border = true
    # col.active_border = rgb(81a1c1)
    # col.inactive_border = rgb(b48ead)
    col.active_border = $rosewater $flamingo $pink $mauve $maroon $peach $teal $sky $sapphire $lavender
    col.inactive_border = $surface0
    # cursor_inactive_timeout = 2
    # col.group_border = rgb(ED8796)
    # col.group_border_active = rgb(8BD5CA)

    layout = dwindle
}

decoration {
  rounding = 5
    # multisample_edges = true # Smooth edges
    blur {
    enabled = true
    size = 5
    passes = 2
    new_optimizations = true
      }

    drop_shadow = true
    shadow_ignore_window = true
    shadow_offset = 0 0
    shadow_range = 15
    shadow_render_power = 5
    col.shadow = 0x66000000
}

animations {

    bezier = decel, 0.05, 0.7, 0.1, 1
    bezier = overshot,0.7,0.6,0.1,1.1
    bezier = easeOutback,0.34,1.56,0.64,1

    enabled=1
    animation = windows, 1, 2, overshot, slide
    animation = windowsOut, 1, 2, default, popin 10%
    animation = windowsMove, 1, 2, default
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces,1,5,easeOutback,slide
    animation = specialWorkspace,1,4,easeOutback,slidevert
}

dwindle {
    pseudotile = yes
    force_split = 2
    preserve_split = true # you probably want this
    special_scale_factor = .98
}

windowrule = float, fuzzylaunch
windowrule = stayfocused, copyq
windowrule = float, copyq
windowrule = pin, copyq
windowrule = size 40% 50%, copyq
windowrulev2 = float,class:(.*)(firefox)$,title:(.*)(- MetaMask)$
windowrule = float, opaque
windowrule = animation decel, fuzzylaunch
windowrule = dimaround, fuzzylaunch
windowrule = move 70% 18%, fuzzylaunch
windowrule = rounding 10, fuzzylaunch
windowrule = noborder, fuzzylaunch
windowrule = noshadow, fuzzylaunch
windowrule = pin, dragon-drop
windowrule = workspace 9, Gimp
windowrule = workspace 4, Signal
windowrule = workspace 8, popp
# windowrule = noblur,^(firefox)$
# windowrule = noanim,^(firefox)$
windowrule = workspace 3, org.telegram.desktop
windowrule = workspace 5, epyterm
windowrule = workspacespecial,scratch
windowrule = workspace special,animation:decel

misc {
  enable_swallow = true
  swallow_regex = ^footclient$
  swallow_regex = footclient
  swallow_regex = ^foot$
  swallow_regex = foot
  swallow_regex = ^(scratch)*
  disable_hyprland_logo = true
  disable_splash_rendering = true
  focus_on_activate = true
  new_window_takes_over_fullscreen = 2
}

workspace = special:one, on-created-empty footclient
workspace = special:two, on-created-empty footclient

# Binds
$mod1 = SUPER
$mod2 = SUPERSHIFT
$mod3 = SUPERALT
$mod4 = Alt_L
$term = footclient

bind = $mod1, Escape, exec, swaylock
bind = $mod1, Return, exec, $term
bind = $mod1, Q, killactive, 
bind = $mod1 CONTROL SHIFT, M, exec, pkill waypad
bind = $mod1 CONTROL SHIFT, M, exit, 
bind = $mod1, S, pin, 
bind = $mod1 SHIFT, X, exec, grim -g "$(slurp)" - | swappy -f - -o /home/siki/pix/ss
bind = $mod1 SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod1 SHIFT, G, exec, grim

# Scratchpads
     # bind = $mod1 SHIFT, Return, exec, hyprctl clients | grep scratch > /dev/null || setsid -f waypad
     bind = $mod2, Return, togglespecialworkspace, one
     bind = $mod4 Shift, Return, togglespecialworkspace, two
     bind = $mod1, M, movetoworkspace, special:one
     bind = $mod4, M, movetoworkspace, special:two
     bindl = ,switch:Lid Switch, exec, swaylock
     bind = ,XF86PowerOff, exec, wact

# scripts
     bind = ALT, Space, exec, tofi-run | sh
     bind = $mod1, grave, exec, demoji
     bind = $mod1 SHIFT, b, exec, wayread
     bind = $mod1, Backspace, exec, wact
     bind = $mod1, P, exec, passmenu
     bind = $mod1, X, exec, battery
     bind = $mod1, C, exec, copyq toggle

# Apps
     bind = $mod1, W, exec, [workspace 2] firefox -P chlfn
     bind = CONTROL, Escape, exec, $term -e btop

# Function keys
     bind = $mod1, F1, exec, timer &
     bind = $mod1, F2, dpms, on
     bind = ,XF86Display, dpms, off
     bind = $mod1, F4, exec, $term -e pulsemixer
     bind = $mod1, F6, exec, torwrap
     bind = $mod1, F7, exec, td-toggle
     bind = $mod1, F11, exec, [float;pin] mpv av://v4l2:/dev/video0 --profile=low-latency --untimed --vf=hflip,rotate=0 --title=webcam
     bind = $mod1, F12, exec, checkup

# Move focus with mod + arrow keys
     bind = $mod1, G, togglegroup
     bind = $mod1, period, changegroupactive, f
     bind = $mod1 SHIFT, D, togglesplit, # dwindle
     bind = $mod1, K, cyclenext,
     bind = $mod1, J, cyclenext, prev
     binde = $mod1 SHIFT, L, resizeactive, 40 0
     binde = $mod1 SHIFT, H, resizeactive, -40 0
     binde = $mod1 SHIFT, k, resizeactive, 0 -40
     binde = $mod1 SHIFT, j, resizeactive, 0 40
     bind = $mod1, Space, layoutmsg, swapwithmaster 
     bind = $mod1 SHIFT, Space, togglefloating, 
     bind = $mod1, F, fullscreen, 0 
     bind = $mod1, b, exec, pidof waybar && killall waybar || setsid -f waybar

# Media
     binde = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%+ 
     binde = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%-
     bind = $mod1, XF86AudioMute, exec, playerctl play-pause
     bind = $mod1, XF86AudioRaiseVolume, exec, playerctl next
     bind = $mod1, XF86AudioLowerVolume, exec, playerctl previous

     # binde = Alt_L, Super_L, exec, wpctl set-volume @DEFAULT_SOURCE@ 3%+ 
     # binde = Control_L, Alt_L, exec, wpctl set-volume @DEFAULT_SOURCE@ 3%-

     bind = ,XF86AudioMute,exec,wpctl set-mute @DEFAULT_SINK@ toggle
     bind = ,XF86AudioMicMute,exec,wpctl set-mute 123 toggle

     binde= ,XF86MonBrightnessDown, exec, doas xbacklight -dec 2 && notify-send -i "lol" "☀️  $(xbacklight -get)" -t 1000 -r 1
     binde= ,XF86MonBrightnessUp, exec, doas xbacklight -inc 2 && notify-send -i "lol" "☀️  $(xbacklight -get)" -t 1000 -r 1
     binde= ALT ,9, exec, light -U 2 && notify-send -i "lol" "☀️  $(light -G | cut -d'.' -f1)" -t 1000 -r 1
     binde= ALT ,0, exec, light -A 2 && notify-send -i "lol" "☀️  $(light -G | cut -d'.' -f1)" -t 1000 -r 1

# Switch workspaces with mod + [0-9]
     bind = $mod1, 1, workspace, 1
     bind = $mod1, 2, workspace, 2
     bind = $mod1, 3, workspace, 3
     bind = $mod1, 4, workspace, 4
     bind = $mod1, 5, workspace, 5
     bind = $mod1, 6, workspace, 6
     bind = $mod1, 7, workspace, 7
     bind = $mod1, 8, workspace, 8
     bind = $mod1, 9, workspace, 9
     bind = $mod1, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
     bind = $mod1 SHIFT, 1, movetoworkspacesilent, 1
     bind = $mod1 SHIFT, 2, movetoworkspacesilent, 2
     bind = $mod1 SHIFT, 3, movetoworkspacesilent, 3
     bind = $mod1 SHIFT, 4, movetoworkspacesilent, 4
     bind = $mod1 SHIFT, 5, movetoworkspacesilent, 5
     bind = $mod1 SHIFT, 6, movetoworkspacesilent, 6
     bind = $mod1 SHIFT, 7, movetoworkspacesilent, 7
     bind = $mod1 SHIFT, 8, movetoworkspacesilent, 8
     bind = $mod1 SHIFT, 9, movetoworkspacesilent, 9
     bind = $mod1 SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mod + scroll
     bind = $mod1, mouse_down, workspace, e+1
     bind = $mod1, mouse_up, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
     bindm = $mod1, mouse:272, movewindow
     bindm = $mod1, mouse:273, resizewindow
